<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bank Details Form</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="hacker">

    <h1>🏦 Secure Bank Details</h1>

    <form method="POST" action="/bank" class="bank-form">
        <input type="text" name="name" placeholder="👤 Full Name" required><br><br>

        <input type="text" name="account" placeholder="💳 Account Number" required><br><br>

        <input type="text" name="ifsc" placeholder="🏦 IFSC Code" required><br><br>

        <button type="submit">🔐 Submit Securely</button>
    </form>

    <br>
    <a href="/">⬅ Back to Home</a>

</body>
</html>
