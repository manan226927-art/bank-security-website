<!DOCTYPE html>
<html>
<head>
    <title>Bank Details Verification</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="login-box">
    <h1>🏦 BANK DETAILS FORM</h1>

    <form onsubmit="goDashboard(); return false;">
        <input type="text" placeholder="👤 Account Holder Name" required>
        <input type="text" placeholder="🏦 Bank Name" required>
        <input type="number" placeholder="💳 Account Number" required>
        <input type="number" placeholder="📱 Mobile Number" required>
        <input type="number" placeholder="💰 Account Balance" required>

        <button type="submit">🔐 VERIFY & CONTINUE</button>
    </form>

    <p>🛡️ All data is encrypted & secure</p>
</div>

<script>
function goDashboard() {
    window.location.href = "/dashboard";
}
</script>

</body>
</html>
